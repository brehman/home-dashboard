<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home TV Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =========================
   GLOBAL THEME
========================= */
:root{
  --bg:#070A12;
  --card:#0f172a;
  --stroke:#24314f;
  --text:#f8fafc;
  --muted:#9ca3af;
  --accent:#38bdf8;
  --good:#22c55e;
  --warn:#facc15;
  --bad:#ef4444;
  --radius:20px;
  --brightness:1;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:radial-gradient(1200px 700px at 30% 10%, #1e3a8a, var(--bg));
  color:var(--text);
  overflow:hidden;
  filter:brightness(var(--brightness));
}

/* =========================
   WEATHER CANVAS
========================= */
#wxCanvas{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.65;
}

/* =========================
   LAYOUT
========================= */
.app{
  position:relative;
  z-index:1;
  height:100%;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--stroke);
  border-radius:var(--radius);
}

h1{margin:0;font-size:22px}

.controls{
  display:flex;
  align-items:center;
  gap:10px;
}

button{
  background:#020617;
  color:white;
  border:1px solid var(--stroke);
  border-radius:14px;
  padding:8px 14px;
  font-size:16px;
  cursor:pointer;
}

button.active{
  background:var(--accent);
  color:#020617;
  font-weight:700;
}

.page{
  flex:1;
  display:none;
}

.page.active{display:grid}

/* =========================
   GRIDS
========================= */
.page.today{
  grid-template-columns:1.2fr .8fr;
  grid-template-rows:1fr 1fr;
  gap:12px;
}

.page.plan{
  grid-template-columns:1.3fr .7fr;
  gap:12px;
}

/* =========================
   CARDS
========================= */
.card{
  background:rgba(255,255,255,.07);
  border:1px solid var(--stroke);
  border-radius:var(--radius);
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow:hidden;
}

.card h2{
  margin:0;
  font-size:18px;
}

/* =========================
   WEATHER
========================= */
.bigTemp{
  font-size:48px;
  font-weight:800;
}

.wxMeta{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  color:var(--muted);
}

/* =========================
   LISTS
========================= */
.list{
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow:auto;
}

.row{
  padding:8px 10px;
  background:#020617;
  border-radius:12px;
  border:1px solid var(--stroke);
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.row b{color:var(--accent)}
.small{color:var(--muted);font-size:13px}

/* =========================
   IFRAME
========================= */
iframe{
  flex:1;
  border:0;
  border-radius:14px;
}
</style>
</head>

<body>
<canvas id="wxCanvas"></canvas>

<div class="app">

<header>
  <h1>🏡 Home Dashboard</h1>
  <div class="controls">
    <button id="btnToday" class="active">Today</button>
    <button id="btnPlan">Planning</button>
    <button id="btnNight">🌙</button>
    <input type="range" min="0.6" max="1.2" step="0.01" value="1" id="brightness">
  </div>
</header>

<!-- ================= TODAY ================= -->
<section id="pageToday" class="page today active">

  <!-- Weather -->
  <div class="card" style="grid-row:1/3">
    <h2>🌦 Weather – Viherlaakso</h2>
    <div class="bigTemp" id="wxTemp">--°</div>
    <div class="wxMeta">
      <span>💨 <b id="wxWind">--</b></span>
      <span>💧 <b id="wxHum">--</b></span>
      <span>🌧 <b id="wxPop">--</b></span>
    </div>
    <div class="list" id="wxHourly"></div>
  </div>

  <!-- Stops -->
  <div class="card">
    <h2>🚌 Nearby Stops</h2>
    <div class="list" id="stopList"></div>
  </div>

  <!-- Routes -->
  <div class="card">
    <h2>🧭 Leave in 5 min</h2>
    <div class="list" id="routeList"></div>
  </div>

</section>

<!-- ================= PLANNING ================= -->
<section id="pagePlan" class="page plan">

  <div class="card">
    <h2>📅 Calendar – Week Agenda</h2>
    <iframe
      src="https://calendar.google.com/calendar/embed?src=np0k334u9q2aj93rdlpfeeuklo%40group.calendar.google.com&ctz=Europe%2FHelsinki&mode=AGENDA&showTitle=0&showNav=0&showPrint=0&showCalendars=0">
    </iframe>
  </div>

  <div class="card">
    <h2>⚡ Spot Price (Fingrid)</h2>
    <canvas id="priceCanvas"></canvas>
    <div class="small">
      Dataset 124 • €/MWh
    </div>
  </div>

</section>

</div>

<script>
/* =========================
   CONFIG
========================= */
/* =========================
   STOP UI CACHE (IMPORTANT)
========================= */

const stopUICache = {}; // keyed by stopNumericId
const AUTO_ROTATE_MS = 30000;

const ORIGIN = "Törmäniityntie 18, Espoo";

const DEST_A = "Pietari Kalmin katu 7, 00560 Helsinki";
const DEST_B = "Pohjoisesplanadi 37 A, 00100 Helsinki";

const STOP_IDS = [
  "HSL:2111552",
  "HSL:2111504",
  "HSL:2151204",
  "HSL:2151208"
];

const DIGITRANSIT_GQL = "https://api.digitransit.fi/routing/v2/hsl/gtfs/v1";
const GEOCODE = "https://api.digitransit.fi/geocoding/v1/search";

const FINGRID_API_KEY = "d1520bbd157547bd8c5e90c9dca626ef";
const FINGRID_VAR_ID = "124";

/* =========================
   PAGE ROTATION
========================= */
let page = 0;
const pages = ["pageToday","pagePlan"];

function showPage(i){
  page = i % 2;
  pages.forEach((p,idx)=>{
    document.getElementById(p).classList.toggle("active", idx===page);
  });
  document.getElementById("btnToday").classList.toggle("active", page===0);
  document.getElementById("btnPlan").classList.toggle("active", page===1);
}
setInterval(()=>showPage(page+1), AUTO_ROTATE_MS);

document.getElementById("btnToday").onclick=()=>showPage(0);
document.getElementById("btnPlan").onclick=()=>showPage(1);

/* =========================
   NIGHT + BRIGHTNESS
========================= */
document.getElementById("brightness").oninput=e=>{
  document.documentElement.style.setProperty("--brightness", e.target.value);
};
let night=false;
document.getElementById("btnNight").onclick=()=>{
  night=!night;
  document.body.style.background = night ? "#020617" : "";
};

/* =========================
   WEATHER + ANIMATION
========================= */
const wxCanvas = document.getElementById("wxCanvas");
const ctx = wxCanvas.getContext("2d");
function resize(){
  wxCanvas.width=innerWidth;
  wxCanvas.height=innerHeight;
}
window.onresize=resize; resize();

let drops=[];
function animate(){
  ctx.clearRect(0,0,wxCanvas.width,wxCanvas.height);
  ctx.fillStyle="rgba(180,220,255,.6)";
  drops.forEach(d=>{
    d.y+=d.v;
    if(d.y>wxCanvas.height){d.y=0;d.x=Math.random()*wxCanvas.width}
    ctx.fillRect(d.x,d.y,2,8);
  });
  requestAnimationFrame(animate);
}
for(let i=0;i<120;i++){
  drops.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,v:4+Math.random()*4});
}
animate();

/* =========================
   WEATHER DATA
========================= */
fetch("https://api.open-meteo.com/v1/forecast?latitude=60.233&longitude=24.75&current=temperature_2m,relative_humidity_2m,wind_speed_10m")
.then(r=>r.json()).then(d=>{
  document.getElementById("wxTemp").textContent=d.current.temperature_2m+"°";
  document.getElementById("wxHum").textContent=d.current.relative_humidity_2m+"%";
  document.getElementById("wxWind").textContent=d.current.wind_speed_10m+" m/s";
});



/* =========================
   FINGRID CHART
========================= */
const priceCanvas=document.getElementById("priceCanvas");
const pctx=priceCanvas.getContext("2d");
priceCanvas.width=priceCanvas.offsetWidth;
priceCanvas.height=priceCanvas.offsetHeight;

fetch(`https://api.fingrid.fi/v1/variable/${FINGRID_VAR_ID}/events/json?start_time=${new Date(Date.now()-24*3600e3).toISOString()}&end_time=${new Date().toISOString()}`,{
  headers:{"x-api-key":FINGRID_API_KEY}
}).then(r=>r.json()).then(data=>{
  const vals=data.map(e=>e.value);
  const min=Math.min(...vals), max=Math.max(...vals);
  pctx.strokeStyle="#38bdf8";
  pctx.beginPath();
  vals.forEach((v,i)=>{
    const x=i*(priceCanvas.width/(vals.length-1));
    const y=priceCanvas.height-(v-min)/(max-min)*priceCanvas.height;
    i?pctx.lineTo(x,y):pctx.moveTo(x,y);
  });
  pctx.stroke();
});


/* =========================
   HSL STOP WIDGET (EXACT FORMAT)
========================= */

function titleCaseMode(mode){
  // BUS/TRAM/RAIL/SUBWAY -> Bus/Tram/Train/Metro
  const m = (mode || "").toUpperCase();
  if (m === "BUS") return "Bus";
  if (m === "TRAM") return "Tram";
  if (m === "RAIL") return "Train";
  if (m === "SUBWAY") return "Metro";
  if (m === "FERRY") return "Ferry";
  return mode ? mode[0].toUpperCase() + mode.slice(1).toLowerCase() : "Line";
}

async function fetchStop(stopNumericId){
  // stopNumericId: "2151204"
  const stopId = `HSL:${stopNumericId}`;

  // IMPORTANT: use route { shortName, mode } (not routeShortName)
  const query = `
    query {
      stop(id: "${stopId}") {
        name
        code
        stoptimesWithoutPatterns(numberOfDepartures: 1) {
          serviceDay
          realtime
          realtimeDeparture
          scheduledDeparture
          trip {
            route {
              shortName
              mode
            }
          }
        }
      }
    }`;

  const res = await fetch(DIGITRANSIT_GQL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query })
  });

  const json = await res.json();
  if (json.errors) throw new Error(json.errors.map(e => e.message).join("; "));

  const stop = json.data?.stop;
  if (!stop) throw new Error("Stop not found");

  const st = stop.stoptimesWithoutPatterns?.[0] || null;

  // If no departures, still show name & code
  if (!st) {
    return {
      stopNumericId,
      name: stop.name || "Unknown",
      code: stop.code || "",
      modeLabel: "",
      routeShort: "",
      mins: null
    };
  }

  const sec = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
  const timeMs = (st.serviceDay + sec) * 1000;
  const mins = Math.max(0, Math.round((timeMs - Date.now()) / 60000));

  const routeShort = st.trip?.route?.shortName || "—";
  const modeLabel = titleCaseMode(st.trip?.route?.mode || "");

  return {
    stopNumericId,
    name: stop.name || "Unknown",
    code: stop.code || "",
    modeLabel,
    routeShort,
    mins
  };
}

async function loadNearbyStops(){
  const list = document.getElementById("stopList");

  const STOP_ORDER = ["2151204", "2151208", "2111504", "2111552"];

  // Create UI ONCE
  if (Object.keys(stopUICache).length === 0) {
    list.innerHTML = "";

    for (const id of STOP_ORDER) {
      const wrapper = document.createElement("div");
      wrapper.className = "row";

      wrapper.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:6px; width:100%;">
          <div><b>STOPID: ${id}</b></div>
          <div class="stopName">Loading…</div>
          <div class="stopLine"><b>Loading…</b></div>
          <iframe
            src="https://reittiopas.hsl.fi/pysakit/HSL%3A${id}"
            style="
              margin-top:6px;
              width:100%;
              height:260px;
              border-radius:12px;
              border:1px solid var(--stroke);
              background:#020617;
            "
            loading="lazy">
          </iframe>
        </div>
      `;

      list.appendChild(wrapper);

      stopUICache[id] = {
        nameEl: wrapper.querySelector(".stopName"),
        lineEl: wrapper.querySelector(".stopLine")
      };
    }
  }

  // Update DATA ONLY (no DOM rebuild)
  for (const id of STOP_ORDER) {
    try {
      const data = await fetchStop(id);

      const line =
        data.mins == null
          ? "No upcoming departures"
          : `${data.modeLabel} ${data.routeShort} in ${data.mins} Minutes`;

      stopUICache[id].nameEl.textContent =
        data.name + (data.code ? " " + data.code : "");

      stopUICache[id].lineEl.innerHTML = `<b>${line}</b>`;

    } catch (err) {
      console.error("Stop update failed:", id, err);
      stopUICache[id].lineEl.textContent = "Data unavailable";
    }
  }
}

loadNearbyStops();                    // initial load
//setInterval(loadNearbyStops, 60000);  // refresh every minute

</script>

</body>
</html>
